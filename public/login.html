<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>tthome</title>
<style>
  :root { --bg: #f3f4f6; --card: #fff; --text: #14171c; --muted: #646b78; --border: #e2e5ea; --accent: #2563eb; --danger: #dc2626; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0e1014; --card: #171a20; --text: #e8eaee; --muted: #9399a5; --border: #272b33; --accent: #4f8cff; --danger: #f87171; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  form { width: 100%; max-width: 340px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 24px; }
  h1 { margin: 0 0 4px; font-size: 20px; }
  p { margin: 0 0 18px; color: var(--muted); font-size: 13px; }
  input { width: 100%; padding: 10px 12px; font: inherit; border-radius: 9px; border: 1px solid var(--border);
          background: var(--bg); color: var(--text); margin-bottom: 12px; }
  button { width: 100%; padding: 10px; font: inherit; font-weight: 600; border: 0; border-radius: 9px; background: var(--accent); color: #fff; cursor: pointer; }
  .err { color: var(--danger); font-size: 13px; margin: 0 0 12px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>tthome</h1>
  <p>Devam etmek için şifreni gir.</p>
  <div class="err" id="err" hidden></div>
  <input type="password" name="password" placeholder="Şifre" autocomplete="current-password" autofocus required>
  <button type="submit">Giriş</button>
</form>
<script>
  const e = new URLSearchParams(location.search).get('e');
  if (e) {
    const el = document.getElementById('err');
    el.hidden = false;
    el.textContent = e === 'locked' ? 'Çok fazla hatalı deneme. 15 dakika sonra tekrar dene.' : 'Şifre hatalı.';
  }
</script>
</body>
</html>
